version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gestion_llaves
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://user:userpassword@db:3306/gestion_llaves"
      APP_ENV: dev
      APP_DEBUG: '1'
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/var/www/html
    command: sh -c "composer install && php bin/console doctrine:migrations:migrate --no-interaction && php bin/console doctrine:fixtures:load --no-interaction && symfony server:start --no-tls --allow-http"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app
    command: sh -c "npm install && npm start"

volumes:
  db_data:
