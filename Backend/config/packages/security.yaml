security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Usuario
                property: usuario

    role_hierarchy:
        ROLE_ADMIN: ROLE_ORDENANZA

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/usuarios/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/recuperar-contrasena, roles: PUBLIC_ACCESS }
        - { path: ^/api/configuracion, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY } 
        - { path: ^/admin, roles: ROLE_ADMIN }
